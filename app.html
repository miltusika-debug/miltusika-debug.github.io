<!doctype html>
<html lang="en">
  <head>
<script>
/* 龙老板工作室 · 线上只读模式（注入） */
(function () {
    var RAW_SET = localStorage.setItem.bind(localStorage);
    var RAW_REMOVE = localStorage.removeItem.bind(localStorage);
    // 未通过门禁（无种子数据）→ 回到门禁页
    if (!localStorage.getItem('trading-journal-trades-v1')) {
        location.replace('index.html');
        return;
    }
    // 线上版本为只读快照：交易数据的修改不落盘，刷新即还原
    localStorage.setItem = function (k, v) {
        if (k.indexOf('trading-journal-') === 0) return;
        RAW_SET(k, v);
    };
    localStorage.removeItem = function (k) {
        if (k.indexOf('trading-journal-') === 0) return;
        RAW_REMOVE(k);
    };
})();
</script>
