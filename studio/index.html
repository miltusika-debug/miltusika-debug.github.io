h1 {

table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }

td { padding: 0.6rem; border-bottom: 1px solid rgba(212,175,55,0.15); white-space: nowrap; }
.neg { color: #ef4444; } .pos { color: #22c55e; } .warn { color: #f59e0b; }
.meta { text-align: center; opacity: 0.6; font-size: 0.8rem; margin-top: 1.5rem; }
.readonly-badge {
    display: inline-block; border: 1px solid rgba(212,175,55,0.5); color: #c9a84c;
    border-radius: 12px; padding: 0.1rem 0.7rem; font-size: 0.75rem; margin-left: 0.5rem;

#lockScreen {

    background: rgba(18,21,32,0.9); border: 1px solid rgba(212,175,55,0.4);
    border-radius: 8px; padding: 2.5rem 2rem;
}
#lockScreen .icon { font-size: 2.5rem; margin-bottom: 1rem; }
#lockScreen input {

    border: 1px solid rgba(212,175,55,0.4); background: #0d1018; color: #ece5d3;
    font-size: 1rem; text-align: center; outline: none;
}
#lockScreen button {
    width: 100%; padding: 0.7rem; border: none; border-radius: 4px; cursor: pointer;
    background: linear-gradient(180deg, #d4af37, #9c7c1e); color: #14100a;
    font-size: 1rem; font-weight: bold; letter-spacing: 0.2em;
}
#errMsg { color: #ef4444; font-size: 0.85rem; min-height: 1.2em; margin-top: 0.5rem; }
#dataView { display: none; }
@media (max-width: 640px) {
    .card { padding: 1rem; overflow-x: auto; }
    body { padding: 1rem 0.5rem; }
}
</style>

var ITERATIONS = 200000;

function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
}

function fmtMoney(n) {
    return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function balanceClass(n) {
    return n < 0 ? 'neg' : (n < 50 ? 'warn' : 'pos');
}
function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function unlock() {
    var pw = document.getElementById('pwInput').value;
    var err = document.getElementById('errMsg');
    err.textContent = '';
    if (!pw) { err.textContent = '请输入密码'; return; }
    try {
        var raw = b64ToBytes(PAYLOAD);
        var salt = raw.slice(0, 16), iv = raw.slice(16, 32);
        var tag = raw.slice(raw.length - 32);
        var ct = raw.slice(32, raw.length - 32);

        var pwKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
        var bits = await crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' }, pwKey, 512);
        var km = new Uint8Array(bits);
        var encKey = await crypto.subtle.importKey('raw', km.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
        var macKey = await crypto.subtle.importKey('raw', km.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);

        var toVerify = new Uint8Array(raw.length - 32);
        toVerify.set(raw.slice(0, raw.length - 32));
        var ok = await crypto.subtle.verify('HMAC', macKey, tag, toVerify);
        if (!ok) { err.textContent = '密码错误'; return; }

        var plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, encKey, ct);
        var data = JSON.parse(new TextDecoder().decode(plain));
        render(data);
    } catch (e) {
        err.textContent = '密码错误或数据损坏';
    }
}

function render(data) {
    document.getElementById('lockScreen').style.display = 'none';
    var view = document.getElementById('dataView');
    var html = '';

    if (data.accounts && data.accounts.length) {
        var totalBalance = 0, totalFee = 0;
        data.accounts.forEach(function (a) { totalBalance += a.balance; totalFee += a.monthlyFee; });
        html += '<div class="card"><h2>🤖 机器账号（' + data.accounts.length + '个 · 余额合计 <span class="' +
            balanceClass(totalBalance) + '">' + fmtMoney(totalBalance) + '</span> · 月租合计 ' + fmtMoney(totalFee) + '）</h2>';
        html += '<table><thead><tr><th>机器号</th><th>手机号</th><th>实际控制人</th><th>手机余额</th><th>月租</th><th>类型</th></tr></thead><tbody>';
        data.accounts.forEach(function (a) {
            html += '<tr><td>' + (a.machineNumber != null ? a.machineNumber : '—') + '</td><td>' + esc(a.phone) +
                '</td><td>' + esc(a.owner) + '</td><td class="' + balanceClass(a.balance) + '">' + fmtMoney(a.balance) +
                '</td><td>' + fmtMoney(a.monthlyFee) + '</td><td>' + esc((a.types || []).join('、')) + '</td></tr>';
        });
        html += '</tbody></table></div>';
    }

    if (data.withdrawals && data.withdrawals.length) {
        html += '<div class="card"><h2>💳 提现实名（' + data.withdrawals.length + '条）</h2>';
        html += '<table><thead><tr><th>姓名</th><th>平台</th><th>关联机器号</th></tr></thead><tbody>';
        data.withdrawals.forEach(function (w) {
            html += '<tr><td>' + esc(w.name) + '</td><td>' + esc(w.platform) + '</td><td>' +
                esc((w.machineNumbers || []).join('、')) + '</td></tr>';
        });
        html += '</tbody></table></div>';
    }

    if (data.shareholderAssets && data.shareholderAssets.length) {
        var totalInv = 0;
        data.shareholderAssets.forEach(function (a) { totalInv += a.investment; });
        html += '<div class="card"><h2>👥 股东出资（合计 ' + fmtMoney(totalInv) + '）</h2>';
        html += '<table><thead><tr><th>姓名</th><th>类型</th><th>出资额</th><th>日期</th></tr></thead><tbody>';
        data.shareholderAssets.forEach(function (a) {
            html += '<tr><td>' + esc(a.name) + '</td><td>' + esc(a.type) + '</td><td>' + fmtMoney(a.investment) +
                '</td><td>' + esc(a.date) + '</td></tr>';
        });
        html += '</tbody></table></div>';
    }

    html += '<div class="meta">数据更新于 ' + esc(data.generatedAt) + ' · 本页面为只读快照</div>';
    view.innerHTML = html;
    view.style.display = 'block';
}

document.getElementById('pwInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') unlock();
});
