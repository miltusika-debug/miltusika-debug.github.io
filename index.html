<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙老板工作室 · 交易复盘系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'STSong', 'SimSun', serif;
    background: linear-gradient(160deg, #10141d 0%, #090b10 55%, #16110a 100%);
    color: #ece5d3; min-height: 100vh;
}
.lock {
    max-width: 380px; margin: 15vh auto 0; text-align: center;
    background: rgba(18,21,32,0.9); border: 1px solid rgba(212,175,55,0.4);
    border-radius: 8px; padding: 2.5rem 2rem;
}
.lock h1 {
    letter-spacing: 0.3em; text-indent: 0.3em; font-size: 1.5rem; margin-bottom: 0.3rem;
    background: linear-gradient(180deg, #f5e6b8 0%, #d4af37 45%, #9c7c1e 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.lock .sub { color: #c9a84c; letter-spacing: 0.3em; font-size: 0.75rem; opacity: 0.8; margin-bottom: 1.5rem; }
.lock .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
.lock input {
    width: 100%; padding: 0.7rem; margin: 1rem 0; border-radius: 4px;
    border: 1px solid rgba(212,175,55,0.4); background: #0d1018; color: #ece5d3;
    font-size: 1rem; text-align: center; outline: none;
}
.lock button {
    width: 100%; padding: 0.7rem; border: none; border-radius: 4px; cursor: pointer;
    background: linear-gradient(180deg, #d4af37, #9c7c1e); color: #14100a;
    font-size: 1rem; font-weight: bold; letter-spacing: 0.2em;
}
#errMsg { color: #ef4444; font-size: 0.85rem; min-height: 1.2em; margin-top: 0.5rem; }
.badge { display: inline-block; border: 1px solid rgba(212,175,55,0.5); color: #c9a84c;
    border-radius: 12px; padding: 0.1rem 0.7rem; font-size: 0.75rem; letter-spacing: 0.1em; margin-top: 0.8rem; }
</style>
</head>
<body>
<div class="lock">
    <h1>交易复盘系统</h1>
    <div class="sub">龙老板工作室 · DRAGON BOSS ATELIER</div>
    <div class="icon">🔐</div>
    <div>此系统内容已加密</div>
    <input type="password" id="pwInput" placeholder="请输入访问密码" autocomplete="off">
    <button onclick="unlock()">解 锁</button>
    <div id="errMsg"></div>
    <div class="badge">只读快照 · 数据更新于 2026-09-06 17:37</div>
</div>
<script>
var ITERATIONS = 200000;
var PW_KEY = 'trading-gate-pw';
function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
}
async function unlock() {
    var pw = document.getElementById('pwInput').value;
    var err = document.getElementById('errMsg');
    err.textContent = '';
    if (!pw) { err.textContent = '请输入密码'; return; }
    err.textContent = '解密中…';
    try {
        // 1. 先取版本清单：随机参数 + no-store，任何缓存（含微信内置浏览器）都拦不住
        var vresp = await fetch('version.txt?r=' + Math.random(), { cache: 'no-store' });
        var ver = (await vresp.text()).trim();
        // 2. 按版本号取数据分块：每次发布版本号都变，URL 变了必然拿到最新数据
        var encText = '';
        for (var ci = 1; ci <= 50; ci++) {
            var resp = await fetch('data-' + ci + '.txt?v=' + ver, { cache: 'no-cache' });
            if (!resp.ok) break;
            encText += (await resp.text()).trim();
        }
        var raw = b64ToBytes(encText);
        var salt = raw.slice(0, 16), iv = raw.slice(16, 32);
        var tag = raw.slice(raw.length - 32);
        var ct = raw.slice(32, raw.length - 32);
        var pwKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
        var bits = await crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' }, pwKey, 512);
        var km = new Uint8Array(bits);
        var macKey = await crypto.subtle.importKey('raw', km.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
        var ok = await crypto.subtle.verify('HMAC', macKey, tag, raw.slice(0, raw.length - 32));
        if (!ok) {
            localStorage.removeItem(PW_KEY);  // 密码可能已更换，清掉记住的
            err.textContent = '密码错误';
            return;
        }
        var encKey = await crypto.subtle.importKey('raw', km.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
        var plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, encKey, ct);
        var data = JSON.parse(new TextDecoder().decode(plain));
        Object.keys(data.seeds).forEach(function (k) {
            localStorage.setItem(k, data.seeds[k]);
        });
        localStorage.setItem(PW_KEY, pw);  // 解锁成功：记住密码，下次自动进入
        location.replace('app.html?v=' + ver);  // 带版本跳转，本体更新后强制拉新
    } catch (e) {
        err.textContent = '密码错误或数据损坏';
    }
}
document.getElementById('pwInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') unlock();
});
// 已解锁过：自动填充并直接进入
(function () {
    var saved = localStorage.getItem(PW_KEY);
    if (saved) {
        document.getElementById('pwInput').value = saved;
        document.getElementById('errMsg').textContent = '已记住密码，正在进入…';
        unlock();
    }
})();
</script>
</body>
</html>
